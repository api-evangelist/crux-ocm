name: Crux OCM
description: CruxOCM builds AI-powered automation software for industrial control-room operations in the
  energy-infrastructure sector. Its Industrial Automation Hub (IAH) delivers closed-loop automation on
  top of existing SCADA and DCS systems to increase pipeline throughput, cut operating and energy costs,
  and improve safety without replacing installed control infrastructure. The product family includes pipeBOT,
  gatherBOT, draBOT, maxOPT, leanOPT, and powerOPT, supported by a Deployment Manager, Log Analyser, and
  real-time Status Dashboard. Founded by control-room engineers and operators (CEO Vicki Knott, co-founder
  Roger Shirt) and headquartered in Calgary, Alberta, the company raised a $17M Series A led by Microsoft's
  M12 and serves midstream operators including ONEOK, Delek US, Enbridge, HF Sinclair, and Alliance Pipeline.
  It was surfaced as a Techstars portfolio company and added to the API Evangelist network.
